[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-hate-speech"
version = "1.0.0"
description = "Three-way Chinese hate-speech classification (hate speech / abusive-only / neither) by fine-tuning bert-base-chinese"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wai Ching Leung" }]
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
zh-hate = "zh_hate_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
